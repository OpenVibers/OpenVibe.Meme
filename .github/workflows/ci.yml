name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # install, node --check and npm test: the shared test job (Track Q).
  test:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/test.yml@423fe519b5fe9594cc81b670e5ba5cb9f21f6176
    with:
      syntax-dirs: server test scripts
      # The maker's GIF and MP4 exports call the system ffmpeg.
      apt-packages: ffmpeg
      # ADR-035: PostgreSQL 18 + PgBouncer (transaction mode) + Valkey 9 containers (openvibe-sdk
      # scripts/test-services.sh). npm test runs every file on PGlite; test:pg runs them all through PgBouncer.
      test: 'eval "$(node_modules/openvibe-sdk/scripts/test-services.sh up)" && npm test && npm run test:pg'
  # Secret scan (gitleaks) and dependency audit, shared by every OpenVibers repo (Track Q).
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@8a353d9e7557bfeed2b43deb51271171f8e48fc6
