## ═══════════════════════════════════════════════════════════════
## openvibe.meme — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.meme.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5120, systemd unit openvibe-meme) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in, the API and the forms, and compresses
## text.
##
## No proxy_cache: the app decides cacheability per response (public for the public pages and entries; private,
## no-store for anything drawn for a signed-in person). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=meme_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=meme_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=meme_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.meme www.openvibe.meme;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.meme$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.meme;

    ssl_certificate     /etc/letsencrypt/live/openvibe.meme/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.meme/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.meme$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.meme;

    ssl_certificate     /etc/letsencrypt/live/openvibe.meme/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.meme/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.meme.access.log;
    error_log  /var/log/nginx/openvibe.meme.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=meme_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5120;
    }

    location /auth/ {
        limit_req zone=meme_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5120;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=meme_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5120;
    }

    # ── Forms and other writes: the vote, the caption generator, the report ──
    location ~ ^/(week/vote|make|m/[a-z0-9-]+/report)$ {
        limit_req zone=meme_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5120;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5120/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── OpenVibe.Events' account delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:5120/internal/events directly. Never proxied from outside (ADR-033).
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
